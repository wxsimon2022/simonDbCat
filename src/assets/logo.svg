<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409EFF"/>
      <stop offset="100%" style="stop-color:#2c6b9e"/>
    </linearGradient>
    <linearGradient id="dbLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5aadff"/>
      <stop offset="100%" style="stop-color:#2878c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6A23C"/>
      <stop offset="100%" style="stop-color:#d4882a"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1a2332"/>
  <circle cx="256" cy="256" r="228" fill="url(#dbGrad)" opacity="0.08"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#dbGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Database cylinder - bottom disc -->
  <ellipse cx="256" cy="310" rx="95" ry="28" fill="url(#dbLight)" opacity="0.3"/>

  <!-- Database cylinder - body -->
  <rect x="161" y="200" width="190" height="110" rx="6" fill="url(#dbLight)" opacity="0.9"/>
  <rect x="161" y="200" width="190" height="110" rx="6" fill="url(#dbGrad)" opacity="0.6"/>

  <!-- Database cylinder - top disc -->
  <ellipse cx="256" cy="200" rx="95" ry="28" fill="url(#dbGrad)"/>
  <ellipse cx="256" cy="200" rx="82" ry="22" fill="url(#dbLight)" opacity="0.3"/>

  <!-- Database highlight line -->
  <rect x="175" y="230" width="8" height="70" rx="4" fill="white" opacity="0.15"/>

  <!-- Database ring lines -->
  <path d="M161 240 Q256 265 351 240" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <path d="M161 265 Q256 290 351 265" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Cat ears integrated -->
  <!-- Left ear -->
  <path d="M175 200 L160 120 L215 185" fill="url(#accentGrad)" opacity="0.9"/>
  <path d="M180 195 L168 135 L210 182" fill="#1a2332" opacity="0.3"/>

  <!-- Right ear -->
  <path d="M337 200 L352 120 L297 185" fill="url(#accentGrad)" opacity="0.9"/>
  <path d="M332 195 L344 135 L302 182" fill="#1a2332" opacity="0.3"/>

  <!-- Cat whiskers -->
  <line x1="175" y1="260" x2="120" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="175" y1="265" x2="115" y2="265" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="175" y1="270" x2="120" y2="285" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="337" y1="260" x2="392" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="337" y1="265" x2="397" y2="265" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="337" y1="270" x2="392" y2="285" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cat eyes on the database -->
  <ellipse cx="226" cy="232" rx="10" ry="8" fill="#1a2332"/>
  <ellipse cx="226" cy="232" rx="5" ry="6" fill="url(#accentGrad)"/>
  <circle cx="228" cy="230" r="2.5" fill="white" opacity="0.8"/>

  <ellipse cx="286" cy="232" rx="10" ry="8" fill="#1a2332"/>
  <ellipse cx="286" cy="232" rx="5" ry="6" fill="url(#accentGrad)"/>
  <circle cx="288" cy="230" r="2.5" fill="white" opacity="0.8"/>

  <!-- Cat nose -->
  <path d="M253 248 L256 253 L259 248 Z" fill="#E6A23C"/>

  <!-- Cat mouth -->
  <path d="M256 253 Q248 260 242 255" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M256 253 Q264 260 270 255" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Text -->
  <text x="256" y="390" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="url(#dbGrad)" letter-spacing="2">simonDbCat</text>
  <text x="256" y="418" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5a6a7a" letter-spacing="4" font-weight="300">DATABASE MANAGER</text>
</svg>
